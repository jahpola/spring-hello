plugins {
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
    //id 'com.google.cloud.tools.jib' version '3.4.1'
	id "org.sonarqube" version '7.2.3.7755'
	id "org.flywaydb.flyway" version "12.1.1"
	id 'jacoco'
	id 'java'
}

group = "org.kerminator"
version = "0.0.1-SNAPSHOT"

java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
	mavenCentral()
	maven { url='https://repo.spring.io/milestone' }
}

sonarqube {
  properties {
    property "sonar.projectKey", "jahpola_spring-hello"
    property "sonar.organization", "jahpola"
    property "sonar.host.url", "https://sonarcloud.io"
	property "sonar.tests", "src/test/java"
  }
} 

tasks.named("bootBuildImage") {
	imageName = "public.ecr.aws/kerminator/spring-${project.name}"
	createdDate ="now"
	environment["BP_JVM_VERSION"] = "25"
	//environment["BP_JVM_JLINK_ENABLED"] = "true"
	//environment["BP_JVM_CDS_ENABLED"] = "true"
	//environment["BP_SPRING_AOT_ENABLED"]="true"
}

ext {
	set('springCloudVersion', "2025.1.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-fabric8-all'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.2.2'
    //implementation "io.micrometer:micrometer-tracing-bridge-otel"
    //implementation "io.opentelemetry:opentelemetry-exporter-otlp"
	implementation("org.springframework.boot:spring-boot-starter-flyway:4.0.5")
    implementation 'org.flywaydb:flyway-database-postgresql'
    //runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	developmentOnly("org.springframework.boot:spring-boot-docker-compose")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named("test") {
	useJUnitPlatform()
	//maxParallelForks = 4
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true
    }
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it,exclude: [
				"**/HelloApplication**"
			])
		}))
  	}
}