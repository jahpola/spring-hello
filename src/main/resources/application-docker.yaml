spring:
  datasource:
    url: jdbc:postgresql://database:5432/product
    username: sa
    password: passu
  docker:
    compose:
      enabled: false  # Disable auto-discovery when running in Docker
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    # properties:
    #   hibernate:
    #     format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    
logging:
  level:
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE