server:
  shutdown: graceful
  port: 8081

spring:
  application:
    name: hello
  docker:
    compose:
      enabled: true
      file: compose.dev.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/product
    username: sa
    password: passu
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    # properties:
    #   hibernate:
    #     format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      application: ${spring.application.name}
      cluster: local
      # Micrometer Metrics configures this attribute with "unknown value".
      # It should probably be autoconfigured correctly by Spring Boot.
      "service.name": ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

  #otlp:
  #  tracing:
  #   endpoint: http://otel-collector:4318/v1/traces

