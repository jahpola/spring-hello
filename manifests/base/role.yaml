apiVersion: rbac.authorization.k8s.io/v1
kind: Role 
metadata:
  name: hello
rules:
- apiGroups:
  - ""
  resources:
  - services
  - pods
  - configmaps
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - db-credentials
  verbs:
  - get